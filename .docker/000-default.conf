<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/public

    # IMPORTANTE: Este Alias es necesario porque Apache en Debian tiene un Alias global
    # que redirige /icons/ a /usr/share/apache2/icons/. Este Alias local sobreescribe
    # esa configuración para que /icons/ apunte a nuestros iconos SVG de la aplicación.
    Alias /icons/ /var/www/public/icons/

    # Servir archivos estáticos del frontend
    <Directory /var/www/public>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.html
    </Directory>

    # Configuración para la API
    Alias /api /var/www/api
    <Directory /var/www/api>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php

        # Redirigir todas las solicitudes a index.php
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.php [QSA,L]
    </Directory>

    # ----------------------------------------------------------------------
    # EQUIVALENCIA PARA DESPLIEGUE CON APACHE (Proxy Inverso)
    # ----------------------------------------------------------------------
    # Si usas Apache como servidor principal en lugar de Nginx, necesitas
    # configurar el proxy para que las peticiones a la API JSON vayan al
    # contenedor jsonserver, PERO manteniendo los scripts PHP locales.
    #
    # Requisitos:
    #   - a2enmod proxy proxy_http
    #
    # Configuración (Añadir dentro del VirtualHost):
    #
    #   ProxyPreserveHost On
    #
    #   # 1. Excluir archivos PHP del proxy (para que los procese Apache localmente)
    #   ProxyPassMatch ^/api/(.*\.php)$ !
    #
    #   # 2. Redirigir el resto de /api/ al json-server
    #   ProxyPass /api/ http://jsonserver:3000/
    #   ProxyPassReverse /api/ http://jsonserver:3000/
    #
    # ----------------------------------------------------------------------

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>